[package]
name = "avalanche"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
redb = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
toml = "1.1.8"
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "ava"
path = "src/main.rs"
